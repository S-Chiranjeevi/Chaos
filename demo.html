    // --- SHARED COMPONENTS ---

    // 1. Button
    function Button({
      children,
      onClick,
      type = 'button',
      variant = 'primary',
      size = 'md',
      icon = null,
      iconPosition = 'left',
      helperText = null,
      disabled = false,
      isLoading = false,
      fullWidth = false,
      ariaLabel,
      id,
      className = '',
      ...props
    }) {
      const baseStyles = 'inline-flex flex-col items-center justify-center font-medium rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed select-none active:scale-[0.98] shadow-sm';
      const sizeStyles = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2.5 text-sm',
        lg: 'px-5 py-3 text-base'
      };
      const variantStyles = {
        primary: 'bg-rose-700 hover:bg-rose-800 text-white focus:ring-rose-500 border border-transparent shadow-rose-100',
        secondary: 'bg-emerald-700 hover:bg-emerald-800 text-white focus:ring-emerald-500 border border-transparent',
        outline: 'bg-white hover:bg-stone-50 text-stone-800 border border-stone-300 focus:ring-rose-500 hover:border-stone-400',
        danger: 'bg-red-700 hover:bg-red-800 text-white focus:ring-red-500 border border-transparent shadow-red-100',
        ghost: 'bg-transparent hover:bg-rose-50 text-stone-700 hover:text-rose-900 border border-transparent shadow-none',
        warm: 'bg-amber-600 hover:bg-amber-700 text-white focus:ring-amber-500 border border-transparent'
      };

      const buttonId = id || (ariaLabel ? `btn-${ariaLabel.toLowerCase().replace(/[^a-z0-9]/g, '-')}` : undefined);
      const helperId = helperText && buttonId ? `${buttonId}-helper` : undefined;

      return (
        <div className={`inline-flex flex-col ${fullWidth ? 'w-full' : 'w-auto'}`}>
          <button
            id={buttonId}
            type={type}
            onClick={onClick}
            disabled={disabled || isLoading}
            aria-label={ariaLabel}
            aria-describedby={helperId}
            aria-busy={isLoading}
            className={`${baseStyles} ${sizeStyles[size] || sizeStyles.md} ${variantStyles[variant] || variantStyles.primary} ${fullWidth ? 'w-full' : ''} ${className}`}
            {...props}
          >
            <span className="inline-flex items-center gap-2">
              {isLoading ? (
                <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
              ) : icon && iconPosition === 'left' ? (
                <span className="flex-shrink-0">{icon}</span>
              ) : null}
              <span className="font-semibold tracking-wide">
                {isLoading ? 'Processing...' : children}
              </span>
              {!isLoading && icon && iconPosition === 'right' ? (
                <span className="flex-shrink-0">{icon}</span>
              ) : null}
            </span>
          </button>
          {helperText && (
            <span id={helperId} className="mt-1 text-[11px] leading-tight text-stone-500 text-center font-normal">
              {helperText}
            </span>
          )}
        </div>
      );
    }

    // 2. Card
    function Card({
      children,
      as: Component = 'section',
      variant = 'default',
      className = '',
      title = null,
      subtitle = null,
      headerAction = null,
      footer = null,
      helperText = null,
      onClick = null,
      role = undefined,
      ariaLabel = undefined,
      ...props
    }) {
      const baseCard = 'rounded-2xl transition-all duration-200 overflow-hidden';
      const variantStyles = {
        default: 'bg-white border border-stone-200/80 shadow-sm',
        elevated: 'bg-white border border-stone-200/60 shadow-md hover:shadow-lg',
        outlined: 'bg-stone-50/50 border border-stone-200 shadow-none',
        interactive: 'bg-white border border-stone-200 hover:border-rose-400 hover:shadow-md cursor-pointer active:scale-[0.99]',
        accent: 'bg-gradient-to-br from-rose-50/80 to-amber-50/50 border border-rose-200/70 shadow-sm',
        warning: 'bg-amber-50/70 border border-amber-200 shadow-sm'
      };
      const isClickable = Boolean(onClick);

      return (
        <Component
          className={`${baseCard} ${variantStyles[variant] || variantStyles.default} ${isClickable ? 'cursor-pointer hover:border-rose-300 transition-colors' : ''} ${className}`}
          onClick={onClick}
          role={role || (isClickable ? 'button' : undefined)}
          tabIndex={isClickable ? 0 : undefined}
          aria-label={ariaLabel || (typeof title === 'string' ? title : undefined)}
          onKeyDown={isClickable ? (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              onClick(e);
            }
          } : undefined}
          {...props}
        >
          {(title || subtitle || headerAction) && (
            <header className="px-5 pt-4 pb-3 border-b border-stone-100 flex items-start justify-between gap-4">
              <div>
                {title && (
                  <h2 className="text-base font-semibold text-stone-900 tracking-tight">
                    {title}
                  </h2>
                )}
                {subtitle && (
                  <p className="text-xs text-stone-500 mt-0.5">
                    {subtitle}
                  </p>
                )}
              </div>
              {headerAction && (
                <div className="flex-shrink-0">
                  {headerAction}
                </div>
              )}
            </header>
          )}
          <div className="p-5">{children}</div>
          {(footer || helperText) && (
            <footer className="px-5 py-3 bg-stone-50/70 border-t border-stone-100 flex items-center justify-between text-xs text-stone-600">
              <div>
                {footer}
                {helperText && (
                  <p className="text-[11px] text-stone-500 italic mt-0.5">
                    {helperText}
                  </p>
                )}
              </div>
            </footer>
          )}
        </Component>
      );
    }

    // 3. Badge
    function Badge({
      children,
      variant = 'default',
      size = 'md',
      showDot = false,
      className = '',
      srLabel = null,
      ...props
    }) {
      const sizeStyles = {
        sm: 'text-[11px] px-2 py-0.5 gap-1',
        md: 'text-xs px-2.5 py-1 gap-1.5'
      };
      const variantStyles = {
        default: 'bg-stone-100 text-stone-700 border-stone-200',
        rose: 'bg-rose-50 text-rose-800 border-rose-200',
        emerald: 'bg-emerald-50 text-emerald-800 border-emerald-200',
        amber: 'bg-amber-50 text-amber-800 border-amber-200',
        danger: 'bg-red-50 text-red-800 border-red-200',
        purple: 'bg-purple-50 text-purple-800 border-purple-200',
        blue: 'bg-sky-50 text-sky-800 border-sky-200'
      };
      const dotColors = {
        default: 'bg-stone-400',
        rose: 'bg-rose-500',
        emerald: 'bg-emerald-500',
        amber: 'bg-amber-500',
        danger: 'bg-red-600 animate-pulse',
        purple: 'bg-purple-500',
        blue: 'bg-sky-500'
      };

      return (
        <span
          className={`inline-flex items-center font-medium rounded-full border ${sizeStyles[size] || sizeStyles.md} ${variantStyles[variant] || variantStyles.default} ${className}`}
          {...props}
        >
          {srLabel && <span className="sr-only">{srLabel}: </span>}
          {showDot && (
            <span className={`w-1.5 h-1.5 rounded-full ${dotColors[variant] || dotColors.default}`} aria-hidden="true" />
          )}
          <span>{children}</span>
        </span>
      );
    }

    // 4. DisclaimerBanner
    function DisclaimerBanner() {
      return null;
    }

    // 5. UrgentWarning
    function UrgentWarning({
      title = 'Red-Flag Medical Symptoms Detected',
      description = 'Certain symptoms during pregnancy or acute illness require urgent clinical evaluation by a medical doctor.',
      symptomsList = [
        'Sudden heavy vaginal bleeding or fluid leaking',
        'Severe persistent headache with blurred vision or spots',
        'High fever above 101°F with chills or stiffness',
        'Noticeable decrease or cessation in baby movements (after week 24)'
      ],
      emergencyNumber = '108',
      onEmergencyClick = null,
      className = ''
    }) {
      const handleCall = () => {
        if (onEmergencyClick) {
          onEmergencyClick();
        } else {
          alert('Initiating call to ' + emergencyNumber);
        }
      };

      return (
        <section
          role="alert"
          aria-live="assertive"
          aria-label="Urgent medical alert banner"
          className={`bg-red-50 border-2 border-red-500 rounded-2xl p-5 shadow-sm text-red-950 ${className}`}
        >
          <div className="flex flex-col md:flex-row md:items-start justify-between gap-4">
            <div className="flex items-start gap-3.5">
              <div className="p-2.5 bg-red-600 text-white rounded-xl shadow-sm flex-shrink-0" aria-hidden="true">
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              </div>

              <div className="space-y-2">
                <div>
                  <div className="inline-flex items-center gap-2 mb-1">
                    <span className="bg-red-600 text-white text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full">
                      Immediate Action Required
                    </span>
                    <span className="text-xs font-semibold text-red-700">
                      Do not wait for appointment
                    </span>
                  </div>
                  <h2 className="text-base sm:text-lg font-bold text-red-950">
                    {title}
                  </h2>
                </div>

                <p className="text-xs sm:text-sm text-red-900 leading-relaxed">
                  {description}
                </p>

                {symptomsList && symptomsList.length > 0 && (
                  <ul className="text-xs text-red-800 list-disc list-inside space-y-1 bg-white/70 p-3 rounded-lg border border-red-200">
                    {symptomsList.map((item, idx) => (
                      <li key={idx} className="font-medium">
                        {item}
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            </div>

            <div className="flex flex-col sm:flex-row md:flex-col gap-2.5 items-stretch flex-shrink-0 pt-1">
              <Button
                variant="danger"
                size="md"
                onClick={handleCall}
                ariaLabel={`Call Emergency Helpline ${emergencyNumber} immediately`}
                helperText="Connects to emergency dispatch"
                icon={
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                  </svg>
                }
              >
                Call Helpline ({emergencyNumber})
              </Button>

              <Button
                variant="outline"
                size="sm"
                onClick={() => alert('ASHA Worker Contact: Smt. Sunita Devi - Phone: +91 98765 43210. Available for maternal escort.')}
                ariaLabel="Contact local ASHA or Community Health Worker"
                helperText="Local Community Health Escort"
              >
                Contact Local ASHA Worker
              </Button>
            </div>
          </div>
        </section>
      );
    }

    // 6. LanguageSelector
    function LanguageSelector({ isOpen, onClose, currentLanguage = 'en', onSelectLanguage }) {
      const dialogRef = useRef(null);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isOpen) onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      return (
        <div
          role="dialog"
          aria-modal="true"
          aria-labelledby="lang-modal-title"
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fadeIn"
          onClick={onClose}
        >
          <div
            ref={dialogRef}
            onClick={(e) => e.stopPropagation()}
            className="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-stone-200 overflow-hidden"
          >
            <div className="px-6 py-5 bg-stone-50 border-b border-stone-200 flex items-center justify-between">
              <div>
                <h2 id="lang-modal-title" className="text-lg font-bold text-stone-900">
                  Select Your Language
                </h2>
                <p className="text-xs text-stone-500 mt-0.5">
                  अपनी भाषा चुनें · আপনার ভাষা নির্বাচন করুন
                </p>
              </div>

              <button
                type="button"
                onClick={onClose}
                className="p-2 text-stone-400 hover:text-stone-700 rounded-xl hover:bg-stone-200/50 transition-colors focus:outline-none focus:ring-2 focus:ring-rose-500"
                aria-label="Close language selector modal"
              >
                <span className="text-sm font-bold">✕ Close</span>
              </button>
            </div>

            <div className="px-6 py-3 bg-rose-50/60 border-b border-rose-100/70 text-xs text-rose-900 flex items-center gap-2">
              <svg className="w-4 h-4 text-rose-700 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
              </svg>
              <span>
                Voice input and screen speech dynamically adapt to your selected language.
              </span>
            </div>

            <div className="p-6 max-h-[60vh] overflow-y-auto space-y-2.5">
              {SUPPORTED_LANGUAGES.map((lang) => {
                const isSelected = lang.code === currentLanguage;
                return (
                  <button
                    key={lang.code}
                    type="button"
                    onClick={() => {
                      onSelectLanguage(lang.code);
                      onClose();
                    }}
                    className={`
                      w-full text-left p-3.5 rounded-2xl border transition-all flex items-center justify-between
                      ${isSelected
                        ? 'border-rose-600 bg-rose-50/70 shadow-sm ring-2 ring-rose-500/20'
                        : 'border-stone-200 hover:border-stone-300 hover:bg-stone-50'
                      }
                    `}
                    aria-pressed={isSelected}
                  >
                    <div className="flex flex-col">
                      <div className="flex items-center gap-2">
                        <span className="text-base font-bold text-stone-900">
                          {lang.native}
                        </span>
                        <span className="text-xs text-stone-500">
                          ({lang.name})
                        </span>
                        {isSelected && (
                          <Badge variant="rose" size="sm">Active</Badge>

              variant="accent"
              title={activeArticle.title}
              subtitle={`${activeArticle.category} · ${activeArticle.readingTime}`}
              headerAction={
                <Button
                  variant="outline"
                  size="sm"
                  onClick={() => setActiveArticle(null)}
                  ariaLabel="Close reader view"
                  helperText="Returns to guide list"
                >
                  ✕ Close Guide
                </Button>
              }
            >
              <div className="space-y-4 text-xs sm:text-sm text-stone-800 leading-relaxed max-w-2xl">
                <p className="font-semibold text-rose-900 bg-rose-50 p-3 rounded-xl border border-rose-200">
                  {activeArticle.summary}
                </p>

                <div className="space-y-3">
                  <h4 className="font-bold text-stone-900 text-sm">Key Practical Takeaways for Home Care:</h4>
                  <ul className="list-disc list-inside space-y-2 text-stone-700">
                    <li><strong>Stay Consistent:</strong> Small daily habits like hydration and mindful rest yield compounding benefits.</li>
                    <li><strong>Never Hesitate to Ask:</strong> Bring any unusual sensation up with your ASHA worker or doctor during routine antenatal checkups.</li>
                    <li><strong>Safe Family Sharing:</strong> You can discuss these tips with your partner or elder family members to coordinate healthy meal preparation.</li>
                  </ul>
                </div>

                <div className="pt-4 border-t border-stone-200 flex items-center justify-between">
                  <span className="text-[11px] text-stone-500">
                    Curated in consultation with community obstetric guidelines.
                  </span>
                  <Button
                    variant="primary"
                    size="sm"
                    onClick={() => setActiveArticle(null)}
                    ariaLabel="Finished reading guide"
                    helperText="Back to list"
                  >
                    Done Reading
                  </Button>
                </div>
              </div>
            </Card>
          )}

          {/* Guides Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredArticles.map((article) => (
              <Card
                key={article.id}
                variant="default"
                className="hover:border-rose-300 transition-all flex flex-col justify-between"
              >
                <div className="space-y-3">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <Badge
                      variant={article.urgentContext ? 'danger' : article.categoryColor || 'blue'}
                      size="sm"
                      showDot={article.urgentContext}
                    >
                      {article.category}
                    </Badge>
                    <span className="text-[11px] text-stone-500 font-medium">
                      ⏱️ {article.readingTime}
                    </span>
                  </div>

                  <h3 className="text-base font-bold text-stone-900">
                    {article.title}
                  </h3>

                  <p className="text-xs text-stone-600 leading-relaxed">
                    {article.summary}
                  </p>

                  <div className="flex flex-wrap gap-1.5 pt-1">
                    {article.tags.map((t, idx) => (
                      <span
                        key={idx}
                        className="text-[10px] font-medium text-stone-500 bg-stone-100 px-2 py-0.5 rounded-md"
                      >
                        #{t}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="pt-4 mt-4 border-t border-stone-100 flex items-center justify-between">
                  <span className="text-[11px] text-stone-400">
                    Safe Educational Guide
                  </span>
                  <Button
                    variant={article.urgentContext ? 'danger' : 'outline'}
                    size="sm"
                    onClick={() => setActiveArticle(article)}
                    ariaLabel={`Read guide: ${article.title}`}
                    helperText="Opens complete article"
                  >
                    Read Article →
                  </Button>
                </div>
              </Card>
            ))}
          </div>
        </div>
      );
    }

    // --- MAIN APP CONTROLLER ---
    function App() {
      const [currentPath, setCurrentPath] = useState(() => {
        const hash = window.location.hash.replace('#', '');
        return ['/', '/talk', '/tracker', '/summary', '/learn'].includes(hash) ? hash : '/';
      });

      const [currentLanguage, setCurrentLanguage] = useState('en');
      const [isLanguageModalOpen, setIsLanguageModalOpen] = useState(false);
      const [globalError, setGlobalError] = useState(null);
      const [entries, setEntries] = useState(INITIAL_HEALTH_ENTRIES);

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#', '');
          if (['/', '/talk', '/tracker', '/summary', '/learn'].includes(hash)) {
            setCurrentPath(hash);
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const handleNavigate = (path) => {
        setCurrentPath(path);
        window.location.hash = path;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleTriggerDemoError = () => {
        setGlobalError({
          title: 'Local Vault Sync Warning',
          message: 'IndexedDB transaction took longer than expected. Local encrypted cache remains intact.',
          code: 'ERR_LOCAL_STORAGE_WARN_04'
        });
      };

      const handleAddEntry = (newEntry) => {
        setEntries([newEntry, ...entries]);
      };

      const handleToggleEmptyState = () => {
        setEntries(prev => prev.length > 0 ? [] : INITIAL_HEALTH_ENTRIES);
      };

      const handleEmergencyCall = () => {
        alert('🚨 Emergency Protocol Triggered: Connecting to National Maternal & Ambulance Helpline: 108 / 102.');
      };

      return (
        <div className="min-h-screen bg-stone-100/70 text-stone-900 font-sans flex flex-col selection:bg-rose-100 selection:text-rose-900">
          
          {/* Global Error Banner */}
          <GlobalError
            error={globalError}
            onDismiss={() => setGlobalError(null)}
            onRetry={() => {
              alert('Retrying local storage verification...');
              setGlobalError(null);
            }}
          />

          {/* Top Header */}
          <Header
            currentLanguage={currentLanguage}
            onOpenLanguageSelector={() => setIsLanguageModalOpen(true)}
            onNavigateHome={() => handleNavigate('/')}
            onTriggerDemoError={handleTriggerDemoError}
          />

          {/* Main Body */}
          <div className="flex-1 max-w-7xl w-full mx-auto flex">
            {/* Desktop Sidebar */}
            <Sidebar
              currentPath={currentPath}
              onNavigate={handleNavigate}
              onEmergencyCall={handleEmergencyCall}
            />

            {/* Responsive Main Content */}
            <main
              id="main-content"
              role="main"
              className="flex-1 p-4 sm:p-6 lg:p-8 pb-24 md:pb-12 max-w-5xl w-full focus:outline-none"
              tabIndex={-1}
            >
              {currentPath === '/' && (
                <HomeView
                  onNavigate={handleNavigate}
                  entries={entries}
                  onToggleEmptyState={handleToggleEmptyState}
                />
              )}

              {currentPath === '/talk' && (
                <TalkView onNavigate={handleNavigate} />
              )}

              {currentPath === '/tracker' && (
                <TrackerView
                  onNavigate={handleNavigate}
                  entries={entries}
                  onAddEntry={handleAddEntry}
                />
              )}

              {currentPath === '/summary' && (
                <SummaryView
                  onNavigate={handleNavigate}
                  entries={entries}
                />
              )}

              {currentPath === '/learn' && (
                <LearnView onNavigate={handleNavigate} />
              )}
            </main>
          </div>

          {/* Mobile Bottom Navigation */}
          <MobileNav
            currentPath={currentPath}
            onNavigate={handleNavigate}
          />

          {/* Language Selector Modal */}
          <LanguageSelector
            isOpen={isLanguageModalOpen}
            onClose={() => setIsLanguageModalOpen(false)}
            currentLanguage={currentLanguage}
            onSelectLanguage={(langCode) => setCurrentLanguage(langCode)}
          />

          {/* Accessibility skip link */}
          <a
            href="#main-content"
            className="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 z-50 bg-rose-700 text-white px-4 py-2 rounded-xl shadow-lg text-xs font-semibold"
          >
            Skip directly to main health content
          </a>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
